set timeout=3
set default=0

insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "ClaudeOS" {
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "ClaudeOS (1280x720)" {
    set gfxpayload=1280x720x32
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "ClaudeOS (1920x1080)" {
    set gfxpayload=1920x1080x32
    multiboot2 /boot/kernel.elf
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "ClaudeOS (800x600, safe mode)" {
    set gfxpayload=800x600x32
    multiboot2 /boot/kernel.elf safe
    module2 /boot/initrd.tar initrd
    boot
}

menuentry "ClaudeOS (US keyboard layout)" {
    multiboot2 /boot/kernel.elf kbd=us
    module2 /boot/initrd.tar initrd
    boot
}
